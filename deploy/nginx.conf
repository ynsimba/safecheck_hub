# Safecheck-Hub — hub.safecheckrdc.com
# SPA statique : /var/www/safecheck-hub/dist
#
# Installation :
#   bash deploy/setup-vps.sh

server {
    listen 80;
    listen [::]:80;
    server_name hub.safecheckrdc.com;

    root /var/www/safecheck-hub/dist;
    index index.html;
    client_max_body_size 8M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
