name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: VPS hub.safecheckrdc.com
    runs-on: ubuntu-latest
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 191.215.38.33
          username: safecheck
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: bash /var/www/safecheck-hub/deploy/update.sh
